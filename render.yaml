services:
  - type: web
    name: homegrid-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_NAME
        value: electrical_platform_token
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
