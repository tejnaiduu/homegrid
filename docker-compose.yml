services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27020:27017'
    environment:
      MONGO_INITDB_DATABASE: electrical_material_platform
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/electrical_material_platform
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5174
      CLIENT_URLS: http://localhost:5174
      COOKIE_NAME: electrical_platform_token
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: 'false'
    ports:
      - '5002:5000'
    depends_on:
      - mongo
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5002/api/v1
    environment:
      VITE_API_URL: http://localhost:5002/api/v1
    ports:
      - '5174:4173'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
